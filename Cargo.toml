[package]
name = "bevy_ensemble"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
    "crates/bevy_ensemble_steam",
    "crates/bevy_ensemble_sockets",
    "crates/bevy_ensemble_webrtc",
]

[dependencies]
bevy = { version = "0.19", features = ["serialize"] }
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }

[features]
# Lightweight network counters (bytes/packets in & out, sampled rates).
# A handful of integer adds at the packet boundary — safe to leave on in dev.
netmetrics = []
# Interactive dev overlay: live metrics window + toggleable network-condition
# simulation (delay / jitter / loss / duplication). Implies `netmetrics`.
# Compiled entirely out of release builds — no window, no shim, no cost.
netdebug = ["netmetrics"]
