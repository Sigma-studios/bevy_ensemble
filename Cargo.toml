[package]
name = "bevy_ensemble"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
    "crates/bevy_ensemble_steam",
    "crates/bevy_ensemble_sockets",
    "crates/bevy_ensemble_webrtc",
    "crates/bevy_ensemble_loopback",
]

[dependencies]
bevy = { version = "0.19", features = ["serialize"] }
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }

# Both network features are on by default (release included) so the tooling is
# always available at runtime. Nothing runs until the game opts in by adding the
# relevant plugin — the compiled-in code is inert without it. Strip it entirely
# with `default-features = false` (e.g. for a minimal shipping build).
[features]
default = ["netmetrics", "netdebug"]

# Lightweight network counters (bytes/packets in & out, sampled rates).
# A handful of integer adds at the packet boundary once `NetMetricsPlugin` is added.
netmetrics = []
# Interactive overlay: live metrics window + toggleable network-condition
# simulation (delay / jitter / loss / duplication). Implies `netmetrics`.
# Inert until the game adds `NetDebugPlugin`, so it costs nothing when unused.
netdebug = ["netmetrics"]

# bevy-steamworks pulls the safe `steamworks` wrapper, which transitively depends
# on the crates.io `steamworks-sys`. bevy_ensemble_steam also depends on
# `steamworks-sys` directly (for one raw FFI call the safe wrapper doesn't expose
# yet — see crates/bevy_ensemble_steam/Cargo.toml). Without this patch, cargo
# could resolve two different `steamworks-sys` builds and link the Steam SDK
# twice; the patch forces every `steamworks-sys` in the tree onto the one git
# source. Remove this alongside the direct dep once the safe wrapper ships
# `Matchmaking::request_lobby_data`.
[patch.crates-io]
steamworks-sys = { git = "https://github.com/Noxime/steamworks-rs", rev = "ee85258d2b9965f5d29082e7c104b183d8fda7c9" }
