[package]
name = "bevy_ensemble"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
    "crates/bevy_ensemble_steam",
    "crates/bevy_ensemble_webrtc",
]

[dependencies]
bevy = { version = "0.18", features = ["serialize"] }
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
