[package]
name = "bevy_ensemble_webrtc"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "macros", "time", "rt-multi-thread", "net"] }
futures-util = "0.3"

# Client plugin deps
bevy = { version = "0.18", optional = true }
bevy_ensemble = { path = "../..", optional = true }
matchbox_socket = { version = "0.14", optional = true }
matchbox_protocol = { version = "0.14", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
async-trait = { version = "0.1", optional = true }
tokio-tungstenite = { version = "0.29", optional = true }

# Server deps
axum = { version = "0.8", features = ["ws"], optional = true }
dashmap = { version = "6", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true }

[features]
default = ["client"]
client = [
    "dep:bevy",
    "dep:bevy_ensemble",
    "dep:matchbox_socket",
    "dep:matchbox_protocol",
    "dep:uuid",
    "dep:async-trait",
    "dep:tokio-tungstenite",
]
server = [
    "dep:axum",
    "dep:dashmap",
    "dep:uuid",
    "dep:tracing",
    "dep:tracing-subscriber",
]

[dev-dependencies]
bevy_immediate = "0.5"

[[bin]]
name = "bevy_ensemble_webrtc_server"
path = "src/bin/server.rs"
required-features = ["server"]
