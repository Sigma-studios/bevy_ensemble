[package]
name = "bevy_ensemble_webrtc"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
serde_json = "1"
futures-util = "0.3"

# Client plugin deps
bevy = { version = "0.19", optional = true, default-features = false, features = ["std", "bevy_log"] }
bevy_ensemble = { path = "../..", optional = true }
bevy_ensemble_sockets = { path = "../bevy_ensemble_sockets", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }

# Server deps
axum = { version = "0.8", features = ["ws"], optional = true }
dashmap = { version = "6", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true }
rand = { version = "0.9", optional = true }

# CLI tool deps
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"], optional = true }
rustls = { version = "0.23", features = ["ring"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["sync", "rt", "macros", "time", "rt-multi-thread", "net"] }
# The relay half of `server`. Native only, because a relay is something a deployment runs and a
# browser cannot be one. Already in the graph for any consumer building the client on native --
# `bevy_ensemble_sockets` pulls `webrtc`, which pulls both -- so this adds no compilation there.
turn = { version = "0.17", optional = true }
webrtc-util = { version = "0.17", optional = true }
async-tungstenite = { version = "0.32", features = ["tokio-runtime", "tokio-rustls-native-certs"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", features = ["sync"] }
ws_stream_wasm = { version = "0.7", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
getrandom = { version = "0.3", features = ["wasm_js"] }

[features]
default = ["client"]
client = [
    "dep:bevy",
    "dep:bevy_ensemble",
    "dep:bevy_ensemble_sockets",
    "dep:uuid",
    "dep:async-tungstenite",
    "dep:ws_stream_wasm",
    "dep:wasm-bindgen-futures",
]
server = [
    "dep:axum",
    "dep:dashmap",
    "dep:uuid",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:rand",
    "dep:turn",
    "dep:webrtc-util",
]
cli = [
    "dep:tokio-tungstenite",
    "dep:rustls",
]

[dev-dependencies]
# The example runs a whole app; the plugin itself only needs the ECS and the log.
bevy = "0.19"
bevy_immediate = "0.7"
# `tests/signalling.rs` talks to the in-process server as a plain websocket client; `ws://` on
# loopback, so no TLS.
tokio-tungstenite = "0.26"

[[test]]
name = "signalling"
required-features = ["server"]

[[example]]
name = "relay_probe"
path = "examples/relay_probe.rs"
required-features = ["server"]

[[bin]]
name = "bevy_ensemble_webrtc_server"
path = "src/bin/server.rs"
required-features = ["server"]

[[bin]]
name = "list_lobbies"
path = "src/bin/list_lobbies.rs"
required-features = ["cli"]
